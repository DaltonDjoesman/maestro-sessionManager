name: CI

on:
  push:
    branches: [master, "ddjoesman/**"]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Frontend unit tests
        run: npm test

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
