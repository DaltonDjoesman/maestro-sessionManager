                        <div className="profile-grid">
                          {otherProfiles.map(p => (
                            <ProfileCard 
                              key={p.session_id} 
                              profile={p}
                              activeSession={activeSession}
                              onEdit={handleEditProfile}
                              onDuplicate={handleDuplicate}
                              onDelete={handleDelete}
                              onTogglePin={handleTogglePin}
                              onExecute={executeSession}
                              activeOverflowId={activeOverflowId}
                              setActiveOverflowId={setActiveOverflowId}
                              onExport={handleExportProfile}
                            />
                          ))}
                        </div>
                      ) : (
                        pinnedProfiles.length === 0 && (
                          <div style={{ padding: "48px 0", textAlign: "center", color: "var(--muted)" }}>
                            Nenhum perfil de sessão encontrado. Crie um novo perfil para começar.
                          </div>
                        )
                      )}
                    </div>
                  </div>
                )}

                {/* ==========================================
                    VIEW: PROFILE EDITOR
                    ========================================== */}
                {currentView === "editor" && (
                  <div data-od-id="view-editor">
                    <div className="editor-header">
                      <div className="view-title-group" style={{ marginBottom: 0 }}>
                        <h1 className="view-title">{selectedProfile ? `Editar: ${editName}` : "Nova Sessão"}</h1>
                        <p className="view-subtitle">Edite aplicações, diretórios de trabalho e URLs deste perfil.</p>
                      </div>
                      
                      <div className="editor-tab-nav" data-od-id="editor-tabs">
                        <button 
                          className={`tab-btn ${editorTab === "conteudo" ? "active" : ""}`}
                          onClick={() => setEditorTab("conteudo")}
                        >
                          Conteúdo
                        </button>
                        <button 
                          className={`tab-btn ${editorTab === "captura" ? "active" : ""}`}
                          onClick={() => setEditorTab("captura")}
                        >
                          Capturar Assistente
                        </button>
                        <button 
                          className={`tab-btn ${editorTab === "avancado" ? "active" : ""}`}
                          onClick={() => setEditorTab("avancado")}
                        >
                          Avançado (JSON)
                        </button>
                      </div>

                      <div style={{ display: "flex", gap: "8px" }}>
                        <button className="btn" onClick={() => navigateTo("hub")} data-od-id="editor-cancel-btn">Cancelar</button>
                        <button className="btn btn-primary" onClick={handleSaveProfile} data-od-id="editor-save-btn">Salvar Perfil</button>
                      </div>
                    </div>

                    {/* Tab: Content Structure */}
                    {editorTab === "conteudo" && (
                      <div data-od-id="editor-content-tab">
                        <div className="form-section">
                          <h3 className="form-section-title">Dados Gerais</h3>
                          <div className="form-grid">
                            <div className="form-group">
                              <label className="form-label">Nome da Sessão</label>
                              <input 
                                type="text" 
                                className="form-input" 
                                value={editName}
                                onChange={(e) => setEditName(e.target.value)}
                                placeholder="ex. Desenvolvimento Web"
                              />
                            </div>
                            <div className="form-group">
                              <label className="form-label">ID Único (Session ID)</label>
                              <input 
                                type="text" 
                                className="form-input" 
                                value={editId}
                                onChange={(e) => setEditId(e.target.value)}
                                placeholder="ex. dev-web"
                                disabled={selectedProfile !== null}
                              />
                            </div>
                          </div>
                        </div>

                        {/* Executables application table */}
                        <div className="form-section">
                          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "16px", alignItems: "center" }}>
                            <h3 className="form-section-title" style={{ marginBottom: 0, borderBottom: "none", paddingBottom: 0 }}>Aplicações Sequenciais</h3>
                            <button className="btn" onClick={addAppRow} style={{ height: "28px", fontSize: "12px" }}>
                              + Adicionar Aplicação
                            </button>
                          </div>
                          
                          <table className="app-table">
                            <thead>
                              <tr>
                                <th style={{ width: "30%" }}>Executável / Atalho</th>
                                <th style={{ width: "35%" }}>Argumentos</th>
                                <th style={{ width: "20%" }}>Caminho de Execução (CWD)</th>
                                <th style={{ width: "10%", textAlign: "center" }}>Ignorar se Rodando</th>
                                <th style={{ width: "5%" }}></th>
                              </tr>
                            </thead>
                            <tbody>
                              {editApps.map((app, index) => (
                                <tr key={index}>
                                  <td>
                                    <input 
                                      type="text" 
                                      className="form-input" 
                                      style={{ width: "100%" }}
                                      value={app.executable} 
                                      onChange={(e) => handleAppChange(index, "executable", e.target.value)}
                                      placeholder="ex. code ou firefox"
                                    />
                                  </td>
                                  <td>
                                    <input 
                                      type="text" 
                                      className="form-input" 
                                      style={{ width: "100%" }}
                                      value={app.args} 
                                      onChange={(e) => handleAppChange(index, "args", e.target.value)}
                                      placeholder="ex. . ou --new-window"
                                    />
                                  </td>
                                  <td>
                                    <input 
                                      type="text" 
                                      className="form-input" 
                                      style={{ width: "100%" }}
                                      value={app.cwd} 
                                      onChange={(e) => handleAppChange(index, "cwd", e.target.value)}
                                      placeholder="ex. ~/projetos"
                                    />
                                  </td>
                                  <td style={{ textAlign: "center" }}>
                                    <input 
                                      type="checkbox" 
                                      className="checkbox-input"
                                      checked={app.skip_if_running} 
                                      onChange={(e) => handleAppChange(index, "skip_if_running", e.target.checked)}
                                    />
                                  </td>
                                  <td>
                                    <button 
                                      className="card-btn" 
                                      style={{ color: "var(--danger)", borderColor: "transparent" }}
                                      onClick={() => removeAppRow(index)}
                                    >
                                      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                      </svg>
                                    </button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>

                        {/* Browser launch configuration */}
                        <div className="form-section">
                          <div style={{ display: "flex", gap: "10px", alignItems: "center", marginBottom: "16px" }}>
                            <input 
                              type="checkbox" 
                              id="toggle-browser"
                              className="checkbox-input"
                              checked={editHasBrowser}
                              onChange={(e) => setEditHasBrowser(e.target.checked)}
                            />
                            <label htmlFor="toggle-browser" className="checkbox-label" style={{ fontWeight: 600 }}>Lançar Navegador Isolado nesta Sessão</label>
                          </div>

                          {editHasBrowser && (
                            <div className="form-grid">
                              <div className="form-group">
                                <label className="form-label">Família do Browser</label>
                                <select 
                                  className="form-input"
                                  value={editBrowser.family}
                                  onChange={(e) => setEditBrowser({ ...editBrowser, family: e.target.value })}
                                >
                                  <option value="chromium_like">Chromium (Chrome, Brave, Edge)</option>
                                  <option value="firefox">Firefox (Gecko)</option>
                                </select>
                              </div>
                              <div className="form-group">
                                <label className="form-label">Nome do Perfil de Isolamento</label>
                                <input 
                                  type="text" 
                                  className="form-input" 
                                  placeholder="ex. DevSession"
                                  value={editBrowser.profile}
                                  onChange={(e) => setEditBrowser({ ...editBrowser, profile: e.target.value })}
                                />
                              </div>
                              <div className="form-group form-group-full">
                                <label className="form-label">URLs para abrir (uma por linha)</label>
                                <textarea 
                                  className="json-textarea" 
                                  style={{ height: "80px" }}
                                  placeholder="http://localhost:3000&#10;https://github.com"
                                  value={editBrowser.urls.join("\n")}
                                  onChange={(e) => setEditBrowser({ ...editBrowser, urls: e.target.value.split("\n") })}
                                />
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    {/* Tab: Embedded Capture Assistant */}
                    {editorTab === "captura" && (
                      <div data-od-id="editor-capture-tab">
                        <div style={{ backgroundColor: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-lg)", padding: "20px" }}>
                          <div style={{ marginBottom: "16px" }}>
                            <h3 style={{ fontSize: "15px", fontWeight: "600", marginBottom: "4px" }}>Inserir Aplicações Ativas via Captura</h3>
                            <p style={{ fontSize: "12px", color: "var(--muted)" }}>Selecione as janelas que deseja anexar a este perfil.</p>
                          </div>
                          
                          <CaptureSelector 
                            showProcesses={showProcesses} 
                            setShowProcesses={setShowProcesses}
                            captureSearch={captureSearch}
                            setCaptureSearch={setCaptureSearch}
                            selectedWindows={selectedWindows}
                            onToggleSelect={handleToggleWindowSelect}
                          />

                          <div style={{ marginTop: "16px", display: "flex", justifyContent: "flex-end" }}>
                            <button 
                              className="btn btn-primary" 
                              onClick={handleAddCapturedToProfile}
                              disabled={selectedWindows.length === 0}
                              data-od-id="add-captured-btn"
                            >
                              Adicionar Selecionados ({selectedWindows.length})
                            </button>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* Tab: Advanced JSON */}
                    {editorTab === "avancado" && (
                      <div className="json-editor-container" data-od-id="editor-advanced-tab">
                        <textarea 
                          className="json-textarea"
                          value={editJsonStr}
                          onChange={(e) => setEditJsonStr(e.target.value)}
                        />
                        
                        <div className={`validation-bar ${jsonValid ? "validation-success" : "validation-error"}`}>
                          <div className="status-dot" style={{ backgroundColor: jsonValid ? "var(--success)" : "var(--danger)" }}></div>
                          <span>
                            {jsonValid ? "Estrutura JSON do Perfil Válida" : "Erro de sintaxe JSON. Por favor revise as chaves e aspas."}
                          </span>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* ==========================================
                    VIEW: STANDALONE CAPTURE ASSISTANT
                    ========================================== */}
                {currentView === "capture" && (
                  <div data-od-id="view-capture">
                    <div className="view-title-group">
                      <h1 className="view-title">Assistente de Captura de Sessão</h1>
                      <p className="view-subtitle">Descubra aplicações e janelas ativas em tempo real e crie perfis instantâneos.</p>
                    </div>

                    <div style={{ backgroundColor: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-lg)", padding: "20px" }}>
                      <CaptureSelector 
                        showProcesses={showProcesses} 
                        setShowProcesses={setShowProcesses}
                        captureSearch={captureSearch}
                        setCaptureSearch={setCaptureSearch}
                        selectedWindows={selectedWindows}
                        onToggleSelect={handleToggleWindowSelect}
                      />
                      
                      {selectedWindows.length > 0 && (
                        <div style={{ marginTop: "16px", display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid var(--border)", paddingTop: "16px" }}>
                          <span style={{ fontSize: "13px", color: "var(--muted)" }}>
                            {selectedWindows.length} aplicação(ões) selecionada(s).
                          </span>
                          <button 
                            className="btn btn-primary"
                            onClick={() => {
                              // Create profile from selected
                              setEditName("Nova Sessão Capturada");
                              setEditId("sessao-capturada");
                              setEditApps(selectedWindows.map(w => ({
                                executable: w.path.split("/").pop(),
                                args: "",
                                cwd: "",
                                skip_if_running: true
                              })));
                              setEditBrowser({ family: "chromium_like", profile: "", urls: [""] });
                              setEditHasBrowser(false);
                              setSelectedWindows([]);
                              navigateTo("editor");
                            }}
                            data-od-id="create-from-capture-btn"
                          >
                            Criar Perfil com Selecionados
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* ==========================================
                    VIEW: SETTINGS
                    ========================================== */}
                {currentView === "settings" && (
                  <div data-od-id="view-settings">
                    <div className="view-title-group">
                      <h1 className="view-title">Configurações Gerais</h1>
                      <p className="view-subtitle">Personalize os caminhos padrão, mecanismos do sistema e depuração.</p>
                    </div>

                    <div className="form-section">
                      <h3 className="form-section-title">Diretórios & Perfis</h3>
                      <div className="form-grid">
                        <div className="form-group form-group-full">
                          <label className="form-label">Caminho de Armazenamento JSON</label>
                          <input 
                            type="text" 
                            className="form-input" 
                            value={profilePath} 
                            onChange={(e) => setProfilePath(e.target.value)}
                          />
                        </div>
                        <div className="form-group">
                          <label className="form-label">Browser Padrão do Sistema</label>
                          <input 
                            type="text" 
                            className="form-input" 
                            value={defaultBrowser} 
                            onChange={(e) => setDefaultBrowser(e.target.value)}
                          />
                        </div>
                        <div className="form-group">
                          <label className="form-label">Verbosidade do Log de Ativação</label>
                          <select className="form-input">
                            <option>Info (Padrão)</option>
                            <option>Debug (Completo)</option>
                            <option>Erros Apenas</option>
                          </select>
                        </div>
                      </div>
                    </div>

                    <div className="form-section">
                      <h3 className="form-section-title">Assistente de Captura</h3>
                      <div className="form-group" style={{ gap: "12px" }}>
                        <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
                          <input type="checkbox" id="sett-wm" className="checkbox-input" defaultChecked />
                          <label htmlFor="sett-wm" className="checkbox-label">Window-first discovery em X11 (via wmctrl)</label>
                        </div>
                        <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
                          <input type="checkbox" id="sett-way" className="checkbox-input" defaultChecked />
                          <label htmlFor="sett-way" className="checkbox-label">Fallback automático para processos no Wayland</label>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

              </main>
            </div>

            {/* ==========================================================================
                TERMINAL LOGGER / DRY-RUN OUTPUT OVERLAY
                ========================================================================== */}
            {terminalActive && (
              <div className="terminal-overlay" data-od-id="activation-terminal-overlay">
                <div className="terminal-header">
                  <div className="terminal-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                      <path d="M4 17l6-6-6-6M12 19h10"/>
                    </svg>
                    <span>Terminal Maestro — {dryRunMode ? 'Simulação de Dry-Run' : 'Carregando Sessão'}</span>
                  </div>
                  <div style={{ color: "var(--muted)", fontSize: "11px" }}>[Esc para fechar]</div>
                </div>

                <div className="terminal-body">
                  {terminalLogs.map((log, index) => (
                    <div key={index} className="terminal-log-line">
                      <span className="log-timestamp">[{log.timestamp}]</span>
                      <span className={`log-${log.type}`}>{log.text}</span>
                    </div>
                  ))}
                </div>

                <div className="terminal-footer">
                  <button className="btn" onClick={() => setTerminalActive(false)} data-od-id="close-terminal-btn">
                    Fechar
                  </button>
                  {!dryRunMode && (
                    <button className="btn btn-primary" onClick={() => setTerminalActive(false)} data-od-id="open-log-btn">
                      Abrir Arquivo de Log
                    </button>
                  )}
                </div>
              </div>
            )}

            {/* ==========================================================================
                IMPORT / EXPORT MODALS
                ========================================================================== */}
            {isImportModalOpen && (
              <div className="modal-overlay" onClick={() => { setIsImportModalOpen(false); setImportError(null); setImportJsonStr(""); }} data-od-id="import-modal-overlay">
                <div className="modal-card" onClick={(e) => e.stopPropagation()} data-od-id="import-modal-card">
                  <div className="modal-header">
                    <h3 className="modal-title">Importar Perfil de Sessão</h3>
                    <button className="win-btn win-close" onClick={() => { setIsImportModalOpen(false); setImportError(null); setImportJsonStr(""); }} title="Fechar"></button>
                  </div>
                  <div className="modal-body">
                    <p className="view-subtitle" style={{ marginBottom: "8px" }}>
                      Cole o conteúdo JSON do seu perfil ou carregue um arquivo.
                    </p>
                    
                    <div style={{ display: 'flex', gap: '8px', marginBottom: '8px' }}>
                      <input 
                        type="file" 
                        accept=".json"
                        onChange={(e) => {
                          const file = e.target.files[0];
                          if (file) {
                            const reader = new FileReader();
                            reader.onload = (event) => {
                              setImportJsonStr(event.target.result);
                            };
                            reader.readAsText(file);
                          }
                        }}
                        style={{ display: 'none' }}
                        id="import-file-input"
                      />
                      <button 
                        className="btn" 
                        onClick={() => document.getElementById('import-file-input').click()}
                        style={{ flex: 1 }}
                      >
                        Selecionar Arquivo .json
                      </button>
                    </div>
                    
                    <textarea 
                      className="json-textarea" 
                      placeholder={`{\n  "session_id": "dev-custom",\n  "name": "Meu Perfil Customizado",\n  "applications": [\n    { "executable": "code", "args": "." }\n  ]\n}`}
                      value={importJsonStr}
                      onChange={(e) => setImportJsonStr(e.target.value)}
                      style={{ height: "200px" }}
                    />
                    
                    {importError && (
                      <div className="validation-bar validation-error">
                        <div className="status-dot" style={{ backgroundColor: "var(--danger)" }}></div>
                        <span>{importError}</span>
                      </div>
                    )}
                  </div>
                  <div className="modal-footer">
                    <button 
                      className="btn" 
                      onClick={() => { setIsImportModalOpen(false); setImportError(null); setImportJsonStr(""); }}
                    >
                      Cancelar
                    </button>
                    <button 
                      className="btn btn-primary" 
                      onClick={handleImportProfile}
                      data-od-id="btn-confirm-import"
                    >
                      Validar e Importar
                    </button>
                  </div>
                </div>
              </div>
            )}

            {isExportModalOpen && exportProfileData && (
              <div className="modal-overlay" onClick={() => setIsExportModalOpen(false)} data-od-id="export-modal-overlay">
                <div className="modal-card" onClick={(e) => e.stopPropagation()} data-od-id="export-modal-card">
                  <div className="modal-header">
                    <h3 className="modal-title">Exportar Perfil: {exportProfileData.name}</h3>
                    <button className="win-btn win-close" onClick={() => setIsExportModalOpen(false)} title="Fechar"></button>
                  </div>
                  <div className="modal-body">
                    <p className="view-subtitle" style={{ marginBottom: "8px" }}>
                      Copie o JSON abaixo ou salve como um arquivo de configuração <code>.json</code>.
                    </p>
                    <textarea 
                      className="json-textarea" 
                      readOnly 
                      value={JSON.stringify(exportProfileData, null, 2)}
                      style={{ height: "240px" }}
                    />
                  </div>
                  <div className="modal-footer">
                    <button 
                      className="btn" 
                      onClick={() => {
                        navigator.clipboard.writeText(JSON.stringify(exportProfileData, null, 2));
                      }}
                      data-od-id="btn-copy-json"
                    >
                      Copiar JSON
                    </button>
                    <button 
                      className="btn btn-primary"
                      onClick={() => {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportProfileData, null, 2));
                        const downloadAnchor = document.createElement('a');
                        downloadAnchor.setAttribute("href",     dataStr);
                        downloadAnchor.setAttribute("download",  `${exportProfileData.session_id}.json`);
                        document.body.appendChild(downloadAnchor);
                        downloadAnchor.click();
                        downloadAnchor.remove();
                        setIsExportModalOpen(false);
                      }}
                      data-od-id="btn-download-json"
                    >
                      Baixar Arquivo .json
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>

          {/* Design system layout quick adjustment selector */}
          <div className="tweak-panel" data-od-id="designer-tweaks-panel">
            <span style={{ color: "var(--muted)", fontWeight: "bold" }}>Aparência:</span>
            <button 
              className={`tweak-btn ${themeMode === 'dark' ? 'active' : ''}`}
              onClick={() => setThemeMode('dark')}
            >
              Dark
            </button>
            <button 
              className={`tweak-btn ${themeMode === 'light' ? 'active' : ''}`}
              onClick={() => setThemeMode('light')}
            >
              Light
            </button>
          </div>

        </div>
      );
    }

    // Helper Component: Profile Cards inside Hub
    function ProfileCard({ 
      profile, 
      activeSession, 
      onEdit, 
      onDuplicate, 
      onDelete, 
      onTogglePin, 
      onExecute,
      activeOverflowId,
      setActiveOverflowId,
      onExport
    }) {
      
      const totalApps = profile.applications ? profile.applications.length : 0;
      const isBrowser = profile.browser !== null && profile.browser !== undefined;

      const toggleMenu = (e) => {
        e.stopPropagation();
        if (activeOverflowId === profile.session_id) {
          setActiveOverflowId(null);
        } else {
          setActiveOverflowId(profile.session_id);
        }
      };

      return (
        <div 
          className="profile-card" 
          onClick={() => !profile.invalid && onExecute(profile, false)}
          data-od-id={`profile-card-${profile.session_id}`}
        >
          <div className="card-top">
            <div className="card-title-group">
              <span className="card-name">{profile.name}</span>
              <span className="card-id">{profile.session_id}</span>
            </div>
            
            <button 
              className={`card-btn ${profile.pinned ? 'card-btn-active' : ''}`}
              onClick={(e) => onTogglePin(profile.session_id, e)}
              title={profile.pinned ? "Desafixar" : "Fixar"}
            >
              <svg width="13" height="13" viewBox="0 0 24 24" fill={profile.pinned ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2">
                <path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>
              </svg>
            </button>
          </div>

          <div className="card-badges">
            {profile.invalid ? (
              <span className="badge badge-danger">Perfil Inválido</span>
            ) : (
              <React.Fragment>
                <span className="badge badge-accent">{totalApps} Apps</span>
                {isBrowser && (
                  <span className="badge badge-gray">Browser ({profile.browser.family === 'firefox' ? 'Firefox' : 'Chromium'})</span>
                )}
                {profile.applications.some(app => app.skip_if_running) && (
                  <span className="badge badge-warning">Safe-Skip</span>
                )}
              </React.Fragment>
            )}
          </div>

          <div className="card-actions">
            {activeSession === profile.name ? (
              <span style={{ color: "var(--success)", fontSize: "12px", fontWeight: "bold" }}>Ativo Agora</span>
            ) : (
              <span style={{ fontSize: "11px", color: "var(--muted)" }}>Clique para ativar</span>
            )}
            
            <div className="card-action-btns">
              <button 
                className="card-btn" 
                onClick={(e) => { e.stopPropagation(); onEdit(profile); }}
                title="Editar Perfil"
              >
                <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
              </button>
              
              <div className="overflow-menu-wrapper">
                <button 
                  className="card-btn" 
                  onClick={toggleMenu}
                  title="Mais Ações"
                >
                  <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                  </svg>
                </button>

                {activeOverflowId === profile.session_id && (
                  <div className="overflow-menu" data-od-id={`card-menu-${profile.session_id}`}>
                    <button className="overflow-menu-item" onClick={(e) => { e.stopPropagation(); onExecute(profile, true); setActiveOverflowId(null); }}>
                      <span>Visualizar Dry-run</span>
                    </button>
                    <button className="overflow-menu-item" onClick={(e) => onDuplicate(profile, e)}>
                      <span>Duplicar Perfil</span>
                    </button>
                    <button className="overflow-menu-item" onClick={(e) => onExport(profile, e)}>
                      <span>Exportar Perfil (JSON)</span>
                    </button>
                    <button className="overflow-menu-item danger" onClick={(e) => onDelete(profile.session_id, e)}>
                      <span>Excluir Perfil</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Helper Component: Capture Selector
    function CaptureSelector({ 
      showProcesses, 
      setShowProcesses, 
      captureSearch, 
      setCaptureSearch, 
      selectedWindows, 
      onToggleSelect 
    }) {
      
      const filteredCapture = captureData.filter(item => {
        // Filter out processes if "showProcesses" is off
        if (!showProcesses && item.type === "process") return false;
        
        // Match Search Query
        return item.title.toLowerCase().includes(captureSearch.toLowerCase()) || 
               item.path.toLowerCase().includes(captureSearch.toLowerCase());
      });

      // Group filtered capture items by workspace
      const groupedCapture = filteredCapture.reduce((acc, item) => {
        const ws = item.workspace || "Sem Workspace";
        if (!acc[ws]) {
          acc[ws] = [];
        }
        acc[ws].push(item);
        return acc;
      }, {});

      return (
        <div data-od-id="capture-window-selector">
          <div className="capture-toolbar">
            <div className="search-input-wrapper">
              <svg className="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <input 
                type="text" 
                placeholder="Filtrar processos..." 
                className="search-input"
                value={captureSearch}
                onChange={(e) => setCaptureSearch(e.target.value)}
              />
            </div>

            <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
              <input 
                type="checkbox" 
                id="show-proc"
                className="checkbox-input"
                checked={showProcesses}
                onChange={(e) => setShowProcesses(e.target.checked)}
              />
              <label htmlFor="show-proc" className="checkbox-label">Mostrar processos de segundo plano</label>
            </div>
          </div>

          <div style={{ maxHeight: "280px", overflowY: "auto", display: "flex", flexDirection: "column", gap: "16px" }}>
            {Object.keys(groupedCapture).length === 0 ? (
              <div style={{ padding: "24px", textAlign: "center", color: "var(--muted)" }}>
                Nenhuma aplicação ou processo encontrado.
              </div>
            ) : (
              Object.keys(groupedCapture).map(wsName => (
                <div key={wsName} style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                  <div style={{
                    fontSize: "11px",
                    fontWeight: "600",
                    textTransform: "uppercase",
                    letterSpacing: "0.06em",
                    color: "var(--muted)",
                    padding: "4px 8px",
                    borderBottom: "1px solid var(--border)",
                    display: "flex",
                    alignItems: "center",
                    gap: "6px"
                  }}>
                    <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5" style={{ color: "var(--accent)" }}>
                      <path strokeLinecap="round" strokeLinejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    <span>{wsName}</span>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                    {groupedCapture[wsName].map(item => {
                      const isChecked = selectedWindows.some(w => w.id === item.id);
                      return (
                        <div key={item.id} className="window-item" style={{ marginBottom: 0 }} data-od-id={`window-item-${item.id}`}>
                          <div className="window-main">
                            <input 
                              type="checkbox" 
                              className="window-checkbox checkbox-input"
                              checked={isChecked}
                              onChange={() => onToggleSelect(item)}
                            />
                            <div className="window-details">
                              <span className="window-title">{item.title}</span>
                              <span className="window-meta">
                                <span>Caminho: <code style={{ fontFamily: "var(--font-mono)", fontSize: "11px" }}>{item.path}</code></span>
                              </span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // Render application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<MaestroApp />);
  </script>
</body>
</html>
