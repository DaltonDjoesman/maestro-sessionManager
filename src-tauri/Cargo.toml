[package]
name = "maestro"
version = "0.1.0"
description = "Maestro — Linux session environment manager"
authors = ["you"]
edition = "2021"

[lib]
name = "maestro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
sysinfo = "0.33"
thiserror = "2"
anyhow = "1"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
arboard = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# GPL-3.0-only (Cosmic protocol bindings). Acceptable for this Cosmic/Pop!_OS-targeted
# crate; avoids pulling libcosmic. Use `client` only — no server feature.
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"] }
